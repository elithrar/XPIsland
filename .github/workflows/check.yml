name: Check addon

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pinned Forever API contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Gethe/wow-ui-source
          ref: 943764493e6b16d63ded3ab304150d1f05e58b57 # Forever 1.60.1.70338
          path: .blizzard-api
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/PlayerScriptDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SystemDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SharedTraitsDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/MajorFactionsDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/LegacyConstantsDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SecretAspectConstantsDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/ForbiddenAspectConstantsDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SimpleFrameAPIDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SimpleButtonAPIDocumentation.lua
            /Interface/AddOns/Blizzard_APIDocumentationGenerated/SimpleScriptRegionAPIDocumentation.lua
            /Interface/AddOns/Blizzard_Menu/MenuUtil.lua
            /Interface/AddOns/Blizzard_Menu/Menu.lua
            /Interface/AddOns/Blizzard_Menu/Vanilla/MenuVariants.lua
            /Interface/AddOns/Blizzard_ChatFrameBase/Shared/ChatFrame.lua
            /Interface/AddOns/Blizzard_ChatFrameBase/Mainline/ChatFrameOverrides.lua
            /Interface/AddOns/Blizzard_StatusTrackingBar/Shared/StatusTrackingManager.lua
            /Interface/AddOns/Blizzard_StatusTrackingBar/Mainline/StatusTrackingManagerOverrides.lua
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Test model and runtime
        run: |
          mkdir -p dist
          luajit tests/model_test.lua
          luajit tests/runtime_test.lua
          luajit tests/theme_test.lua
          luajit tests/revision_test.lua
          luajit tests/rate_test.lua
          luajit tests/kills_test.lua
          luajit tests/progression_test.lua
          luajit tests/progression_events_test.lua
          luajit tests/font_selection_test.lua
          luajit tests/font_startup_test.lua
          luajit tests/font_startup_test.lua --fail-paths
          luajit tests/text_layout_test.lua
          luajit tests/motion_test.lua
          luajit tests/indicator_menu_test.lua .blizzard-api/Interface/AddOns
          luajit tests/recovery_test.lua
          luajit tests/polish_test.lua
          luajit tests/tooltip_test.lua
          luajit tests/rested_test.lua .blizzard-api/Interface/AddOns
          luajit tests/features_test.lua
          luajit tests/played_test.lua .blizzard-api/Interface/AddOns
          luajit tests/stock_tracking_test.lua .blizzard-api/Interface/AddOns
          luajit tests/durations_test.lua
          luajit tests/frame_work_test.lua
          luajit tests/stress_test.lua
      - name: Test release guards
        run: python3 tests/release_test.py
      - name: Validate and package addon
        run: python3 tests/package.py
